name: backtest

# Manual run only: Actions tab -> backtest -> Run workflow
on:
  workflow_dispatch:
    inputs:
      setup:
        description: "Setup yang diuji"
        type: choice
        default: ADAPTIVE
        options:
          - ALL
          - PULLBACK
          - BREAKOUT
          - MEAN_REV
          - SMC_SCALP
          - ICT_SCALP
          - ADAPTIVE
      days:
        description: "Panjang SATU jendela, dalam hari"
        default: "90"
      windows:
        description: "Jumlah jendela berurutan (uji ketahanan). 4 x 90 hari = 1 tahun, hasil per periode ditampilkan"
        default: "1"
      pairs:
        description: "Jumlah pair teratas (setup 4H)"
        default: "15"
      fee:
        description: "Fee per sisi (0.0005 = 0,05% taker, 0.0002 = 0,02% maker)"
        default: "0.0005"
      overrides:
        description: "Ubah konstanta bot untuk uji ini, dipisah spasi. Contoh: MIN_SCORE=65 ICT_MAX_PD=0.62"
        default: ""
      end:
        description: "Tanggal akhir YYYY-MM-DD (kosong = sekarang). Dipakai untuk uji di periode berbeda"
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run backtest
        env:
          SETUP: ${{ inputs.setup }}
          DAYS: ${{ inputs.days }}
          WINDOWS: ${{ inputs.windows }}
          PAIRS: ${{ inputs.pairs }}
          FEE: ${{ inputs.fee }}
          END: ${{ inputs.end }}
          OVERRIDES: ${{ inputs.overrides }}
          # Same secret names as your scan workflow (optional: only for the Telegram summary)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python backtest.py --setup "$SETUP" --days "$DAYS" --windows "$WINDOWS" --pairs "$PAIRS" --fee "$FEE" --end "$END" --set $OVERRIDES --telegram

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: bt_out/
