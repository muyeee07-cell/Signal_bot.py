name: scan

on:
  schedule:
    - cron: "0 * * * *"   # tiap jam, sesuaikan sendiri
  workflow_dispatch: {}     # supaya bisa di-trigger manual dari tab Actions

permissions:
  contents: write   # wajib, supaya job ini boleh commit & push balik ke repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python signal_bot.py

      - name: Commit signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_history.json
          git diff --staged --quiet || git commit -m "update signal history"
          git push

