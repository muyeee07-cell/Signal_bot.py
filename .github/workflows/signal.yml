name: scan

# Cara kerja:
# - Tiap run menjalankan bot TERUS-MENERUS selama +-25 menit (cek candle baru tiap 5 menit),
#   jadi tidak bergantung pada jadwal GitHub yang sering telat atau terlewat.
# - Jadwal cron hanya memastikan selalu ada run berikutnya yang mengantre.
#   Run yang menunggu/dibatalkan di daftar Actions itu NORMAL.
# - Run baru dijadwalkan tiap 20 menit (menit 7, 27, 47: menghindari jam bulat yang
#   paling padat di GitHub). Satu run berjalan +-25 menit, jadi run berikutnya
#   menunggu lalu langsung lanjut begitu yang lama selesai.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:           # tombol "Run workflow" manual

# Hanya satu run aktif; run berikutnya menunggu sampai yang berjalan selesai
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write              # dibutuhkan untuk menyimpan signals_history.json

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 32        # pengaman: run macet tidak memblokir antrean

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot (+-25 menit)
        env:
          PYTHONUNBUFFERED: "1"
          RUN_FOREVER: "1"             # bot berputar terus sampai dihentikan oleh timeout
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOP_PAIRS: "50"              # jumlah pair teratas (volume 24 jam)
          SMC_MAX_OPEN: "5"            # maksimal posisi terbuka bersamaan
          SMC_MIN_RISK_PCT: "0.004"    # SL minimal 0,4% harga (batas biaya)
          # SMC_MIN_RISK_PCT_BTC: "0.0015"   # aktifkan untuk membolehkan sinyal BTC dengan SL sempit
          # ACCOUNT_EQUITY: "1000"           # ukuran akun untuk perhitungan Risk (USDT) di sinyal
          # RISK_PER_TRADE: "0.004"          # risiko per trade (0.004 = 0,4%)
        run: timeout 25m python signal_bot.py || [ $? -eq 124 ]

      - name: Commit signal history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f signals_history.json ]; then git add signals_history.json; fi
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan riwayat."
          else
            git commit -m "Update signal history"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
