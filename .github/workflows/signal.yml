name: AlphaQuant V5.1 Signal Bot

on:
  schedule:
    # Run every 15 minutes (UTC)
    - cron: "*/15 * * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphaquant-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    name: SMC Scalp Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # 4. VERIFY ENVIRONMENT
      # ============================================================
      - name: Verify repository and Python
        run: |
          echo "======================================"
          echo " AlphaQuant V5.1 Environment"
          echo "======================================"

          echo ""
          echo "Current UTC time:"
          date -u

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Repository:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking signal_bot.py..."

          if [ ! -f "signal_bot.py" ]; then
            echo "ERROR: signal_bot.py not found!"
            exit 1
          fi

          echo "signal_bot.py: OK"

      # ============================================================
      # 5. RESTORE SIGNAL HISTORY
      # ============================================================
      - name: Restore signals history
        uses: actions/cache@v4
        with:
          path: signals_history.json
          key: signals-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            signals-history-${{ github.ref_name }}-

      # ============================================================
      # 6. CHECK TELEGRAM CONFIGURATION
      # ============================================================
      - name: Check Telegram configuration
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "======================================"
          echo " Telegram Configuration"
          echo "======================================"

          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "ERROR: TELEGRAM_TOKEN is not configured."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: CHAT_ID is not configured."
            exit 1
          fi

          echo "TELEGRAM_TOKEN: OK"
          echo "CHAT_ID: OK"

      # ============================================================
      # 7. RUN ALPHAQUANT
      # ============================================================
      - name: Run AlphaQuant Signal Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

          SMC_MIN_RISK_PCT: ${{ vars.SMC_MIN_RISK_PCT }}
          SMC_MIN_RISK_PCT_BTC: ${{ vars.SMC_MIN_RISK_PCT_BTC }}
          SMC_MAX_OPEN: ${{ vars.SMC_MAX_OPEN }}
          TOP_PAIRS: ${{ vars.TOP_PAIRS }}
          MIN_VOLUME_USDT: ${{ vars.MIN_VOLUME_USDT }}
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY }}
          FEE_PER_SIDE: ${{ vars.FEE_PER_SIDE }}
          REPORT_EVERY_HOURS: ${{ vars.REPORT_EVERY_HOURS }}

          RUN_FOREVER: "0"

        run: |
          set -e

          echo ""
          echo "======================================"
          echo " AlphaQuant V5.1 Signal Bot"
          echo "======================================"

          echo ""
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo ""
          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Branch:"
          echo "${{ github.ref_name }}"

          echo ""
          echo "Run ID:"
          echo "${{ github.run_id }}"

          echo ""
          echo "UTC:"
          date -u

          echo ""
          echo "Starting signal scanner..."
          echo "--------------------------------------"

          python -u signal_bot.py

          EXIT_CODE=$?

          echo "--------------------------------------"
          echo "Bot finished with exit code: $EXIT_CODE"

          exit $EXIT_CODE

      # ============================================================
      # 8. DISPLAY HISTORY STATUS
      # ============================================================
      - name: Check signals history
        if: always()
        run: |
          echo "======================================"
          echo " Signals History"
          echo "======================================"

          if [ -f "signals_history.json" ]; then
            echo "signals_history.json exists."

            echo ""
            echo "File size:"
            ls -lh signals_history.json

            echo ""
            echo "Last modified:"
            stat signals_history.json
          else
            echo "No signals_history.json generated."
          fi

      # ============================================================
      # 9. SAVE SIGNAL HISTORY
      # ============================================================
      - name: Save signals history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: signals_history.json
          key: signals-history-${{ github.ref_name }}-${{ github.run_id }}