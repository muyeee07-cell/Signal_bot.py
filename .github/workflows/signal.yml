name: scan

on:
  schedule:
    - cron: "*/5 * * * *"
concurrency:
  group: scan
  cancel-in-progress: false


permissions:
  contents: write   # wajib, supaya job ini boleh commit & push balik ke repo

# Mencegah dua run jalan bersamaan dan rebutan push ke branch yang sama
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SMC_MIN_RISK_PCT_BTC: "0.0015"
        run: python signal_bot.py

      - name: Commit signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_history.json
          git diff --staged --quiet || git commit -m "update signal history"
          git pull --rebase origin main
          git push


